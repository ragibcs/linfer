[package]
name = "linfer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "linfer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
hf-hub = "0.4"
safetensors = "0.4"
linfer-frontend = { path = "../linfer-frontend" }
linfer-ir = { path = "../linfer-ir" }
linfer-compiler = { path = "../linfer-compiler" }
linfer-format = { path = "../linfer-format" }
linfer-runtime = { path = "../linfer-runtime" }
